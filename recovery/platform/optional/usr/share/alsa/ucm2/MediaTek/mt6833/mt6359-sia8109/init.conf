BootSequence [
	# DL1 -> ADDA (MT6359 DAC)
	cset "name='ADDA_DL_CH1 DL1_CH1' 1"
	cset "name='ADDA_DL_CH2 DL1_CH2' 1"
	cset "name='DAC In Mux' Normal Path"

	# all analog outputs closed until a device is enabled
	cset "name='HP Mux' Open"
	cset "name='RCV Mux' Open"
	cset "name='LOL Mux' Open"
	cset "name='Speaker Switch' 0"
	cset "name='Lineout Volume' 14,14"
	cset "name='Handset Volume' 12"
	cset "name='Headset Volume' 10,10"

	# MT6359 ADC (AMIC over MTKAIF) -> UL1
	cset "name='ADDA_UL_Mux' MTKAIF"
	cset "name='UL_SRC_MUX' AMIC"
	cset "name='UL1_CH1 ADDA_UL_CH1' 1"
	cset "name='UL1_CH2 ADDA_UL_CH2' 1"
	cset "name='PGA1 Volume' 3"
	cset "name='PGA2 Volume' 3"
]
