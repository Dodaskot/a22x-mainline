SectionVerb {
	EnableSequence [
		disdevall ""
		# DL1 -> ADDA (MT6359 DAC)
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='DAC In Mux' Normal Path"

		# all analog outputs closed until a device is enabled
		cset "name='HP Mux' Open"
		cset "name='RCV Mux' Open"
		cset "name='LOL Mux' Open"
		cset "name='Speaker Switch' 0"
		cset "name='Lineout Volume' 14,14"
		cset "name='Handset Volume' 12"
		cset "name='Headset Volume' 10,10"

		# MT6359 ADC (AMIC over MTKAIF) -> UL1
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH2' 1"
		cset "name='PGA1 Volume' 3"
		cset "name='PGA2 Volume' 3"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		cset "name='LOL Mux' Playback_L_DAC"
		# fixed line level: the SIA8109 amp gets quieter (protection) above about -10 dB
		cset "name='Lineout Volume' 0,0"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='LOL Mux' Open"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		# no PlaybackMixerElem: volume is software-only (see EnableSequence)
		PlaybackPriority 100
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	EnableSequence [
		cset "name='RCV Mux' Voice Playback"
	]

	DisableSequence [
		cset "name='RCV Mux' Open"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
		PlaybackPriority 50
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='HP Mux' Audio Playback"
	]

	DisableSequence [
		cset "name='HP Mux' Open"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headset"
		JackControl "Headphone Jack"
		PlaybackPriority 200
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"
	# vendor builtin_Mic_DualMic: main mic AIN0 (MISO0), second mic AIN3 (MISO1)
	EnableSequence [
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA_R_Mux' AIN3"
		cset "name='ADC_R_Mux' Right Preamplifier"
		# max analog gain (+24 dB); the level at +18 dB was very low
		cset "name='PGA1 Volume' 4"
		cset "name='PGA2 Volume' 4"
	]

	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADC_R_Mux' Idle"
		cset "name='PGA_L_Mux' None"
		cset "name='PGA_R_Mux' None"
	]

	Value {
		CapturePCM "hw:${CardId},3"
		CapturePriority 100
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	EnableSequence [
		cset "name='PGA_L_Mux' AIN1"
		cset "name='ADC_L_Mux' Left Preamplifier"
	]

	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]

	Value {
		CapturePCM "hw:${CardId},3"
		JackControl "Headset Mic Jack"
		CapturePriority 200
	}
}
